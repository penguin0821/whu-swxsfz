<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涉外刑事风险治理与合规中心 · Demo v4</title>
<style>
/* ============ embedded subset webfont: Source Han Serif SC (OFL, Adobe) ============ */
@font-face{font-family:'SHS';font-style:normal;font-weight:400;font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_REG_B64}}) format('woff2');}
@font-face{font-family:'SHS';font-style:normal;font-weight:600;font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_SB_B64}}) format('woff2');}
/* ============ tokens ============ */
:root{
  --stage:#141C12; --stage-2:#18221A; --stage-3:#0F1610;
  --paper:#F3EDE2; --paper-2:#FBF7EF;
  --ink:#221D15; --ink-mut:#6E6558;
  --pink:#F3EDE2; --pink-mut:rgba(243,237,226,.66);
  --green:#7FA05A; --green-deep:#3E5B26; --green-soft:rgba(127,160,90,.16);
  --brown:#A9714B; --brown-deep:#8A5A3B; --brown-soft:rgba(169,113,75,.14);
  --line-d:rgba(243,237,226,.14); --line-p:rgba(34,29,21,.14);
  --serif:'SHS',Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:'SHS',Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 10px 30px rgba(20,28,18,.08);
  --gut:72px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--stage);color:var(--pink);-webkit-font-smoothing:antialiased}
::selection{background:var(--green);color:#fff}
button{font-family:inherit;cursor:pointer}
img{user-select:none}
#page{position:relative}
#spineSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#spineSvg .root,#spineSvg .main{fill:none;stroke-linecap:round}
#spineSvg .root{stroke:rgba(243,237,226,.34);stroke-width:1.6}
#spineSvg .main{stroke:rgba(138,90,59,.55);stroke-width:1.6}
#spineSvg .branch{fill:none;stroke:rgba(138,90,59,.4);stroke-width:1.2;stroke-dasharray:4 5;opacity:0;transition:opacity .9s ease}
#spineSvg .branch.on{opacity:1}
#spineSvg .node{fill:var(--paper);stroke:var(--brown-deep);stroke-width:1.4;opacity:0;transform:scale(.4);transform-origin:center;transform-box:fill-box;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.4)}
#spineSvg .node.on{opacity:1;transform:scale(1)}
#spineSvg .ndot{fill:var(--brown-deep);opacity:0;transition:opacity .5s}
#spineSvg .ndot.on{opacity:1}
main{position:relative;z-index:1}
header,footer{position:relative;z-index:2}
.wrap{max-width:1240px;margin:0 auto;padding:0 56px 0 106px}
.kicker{font-size:12.5px;letter-spacing:.1em;color:var(--green)}
.on-paper .kicker{color:var(--green-deep)}
h1,h2,h3,.serif{font-family:var(--serif)}
h2{font-size:clamp(26px,3.2vw,40px);line-height:1.25;margin:14px 0 10px;font-weight:600}
.sub{font-size:15.5px;line-height:1.8;color:var(--pink-mut);max-width:52ch}
.on-paper{background:var(--paper);color:var(--ink)}
.on-paper .sub{color:var(--ink-mut)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* ============ header: full-width quiet top bar ============
   transparent over the hero; frosted ink on dark chapters;
   frosted paper on light chapters (toggled by .on-paper) */
header{position:fixed;top:0;left:0;right:0;z-index:60;width:100%;border-radius:0;border:0;border-bottom:1px solid transparent;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;transition:background .5s ease,border-color .5s ease}
header.scrolled{background:rgba(15,22,16,.72);border-bottom-color:rgba(243,237,226,.10);backdrop-filter:blur(16px) saturate(1.06);-webkit-backdrop-filter:blur(16px) saturate(1.06)}
header.scrolled.on-paper{background:rgba(243,237,226,.84);border-bottom-color:rgba(34,29,21,.10)}
.hd{display:flex;align-items:center;gap:14px;height:54px;padding:0 30px}
#logoBtn{width:34px;height:34px;border:0;padding:0;border-radius:50%;overflow:hidden;background:var(--paper);box-shadow:0 1px 8px rgba(34,29,21,.14);cursor:pointer;line-height:0;transition:transform .25s ease}
#logoBtn:hover{transform:scale(1.07)}
#logoBtn:focus-visible{outline:2px solid var(--green-deep);outline-offset:3px}
.hd img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.26)}
.hd .nm{line-height:1.3;margin-right:auto}
.hd .nm b{font-family:var(--serif);font-size:14px;font-weight:600;display:block;color:var(--ink);transition:color .5s}
.hd .nm span{font-family:var(--serif);font-size:9.5px;letter-spacing:.14em;color:var(--ink-mut);text-transform:uppercase;transition:color .5s}
nav{display:flex;gap:2px}
nav a{position:relative;font-size:13.5px;color:rgba(34,29,21,.72);text-decoration:none;padding:7px 12px;border-radius:8px;transition:color .2s,background .2s}
nav a:hover{color:var(--ink);background:rgba(34,29,21,.07)}
nav a.on{color:var(--ink)}
nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:1.5px;border-radius:1px;background:var(--green-deep)}
.sbtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(34,29,21,.16);background:transparent;color:rgba(34,29,21,.72);border-radius:999px;padding:6px 12px;font-size:12.5px;transition:all .2s}
.sbtn:hover{color:var(--ink);border-color:rgba(34,29,21,.4);background:rgba(34,29,21,.05)}
.sbtn kbd{font-family:var(--mono);font-size:10px;border:1px solid rgba(34,29,21,.22);border-radius:4px;padding:1px 5px;color:rgba(34,29,21,.55)}
.lang{display:flex;border:1px solid rgba(34,29,21,.16);border-radius:999px;padding:3px;background:transparent}
.lang button{font-size:12.5px;border:0;background:none;color:rgba(34,29,21,.66);padding:4px 11px;border-radius:999px;transition:all .2s}
.lang button.on{background:var(--green-deep);color:#F3EDE2}
/* scrolled over dark chapters: frosted ink + light type */
header.scrolled:not(.on-paper) .nm b{color:var(--pink)}
header.scrolled:not(.on-paper) .nm span{color:var(--pink-mut)}
header.scrolled:not(.on-paper) nav a{color:var(--pink-mut)}
header.scrolled:not(.on-paper) nav a:hover{color:var(--pink);background:rgba(243,237,226,.08)}
header.scrolled:not(.on-paper) nav a.on{color:#EAF3DA}
header.scrolled:not(.on-paper) nav a.on::after{background:var(--green)}
header.scrolled:not(.on-paper) .sbtn{color:var(--pink-mut);border-color:rgba(243,237,226,.16);background:transparent}
header.scrolled:not(.on-paper) .sbtn:hover{color:var(--pink);border-color:rgba(243,237,226,.3);background:rgba(243,237,226,.06)}
header.scrolled:not(.on-paper) .sbtn kbd{color:var(--pink-mut);border-color:rgba(243,237,226,.2)}
header.scrolled:not(.on-paper) .lang{border-color:rgba(243,237,226,.16);background:transparent}
header.scrolled:not(.on-paper) .lang button{color:var(--pink-mut)}
header.scrolled:not(.on-paper) .lang button.on{background:var(--green);color:#12200E}
/* logo zoom lightbox */
#logoZoom{position:fixed;inset:0;z-index:130;background:rgba(15,22,18,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
#logoZoom.on{opacity:1;visibility:visible}
#logoZoom .lz-in{text-align:center;transform:scale(.9);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
#logoZoom.on .lz-in{transform:none}
.seal{border-radius:50%;overflow:hidden;background:var(--paper);position:relative}
.seal img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--zoom,1.26))}
#logoZoom .lz-seal{width:min(66vmin,540px);height:min(66vmin,540px);margin:0 auto;box-shadow:0 30px 90px rgba(0,0,0,.5)}
#logoZoom .lz-t{font-family:var(--serif);color:var(--pink);font-size:clamp(20px,2.4vw,30px);margin-top:30px;letter-spacing:.04em}
#logoZoom .lz-s{color:var(--pink-mut);font-size:clamp(11px,1.15vw,15px);letter-spacing:.18em;text-transform:uppercase;margin-top:10px}
#logoZoom .lz-x{position:absolute;top:26px;right:30px;border:1px solid rgba(243,237,226,.3);background:none;color:var(--pink-mut);border-radius:999px;padding:7px 16px;font-size:12px;cursor:pointer;transition:all .2s}
#logoZoom .lz-x:hover{color:var(--pink);border-color:rgba(243,237,226,.6)}
/* ============ language gate ============ */
#gate{position:fixed;inset:0;z-index:120;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:background-color .7s ease,opacity .65s ease,visibility .65s}
#gate.off{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{text-align:center;padding:24px;transform:translateY(-2vh)}
.gate-seal{width:min(48vmin,340px);height:min(48vmin,340px);margin:0 auto 28px;box-shadow:0 22px 56px rgba(34,29,21,.18);transition:transform .95s cubic-bezier(.7,0,.25,1)}
.gate-name{font-family:var(--serif);font-size:clamp(21px,2.7vw,34px);color:var(--ink);letter-spacing:.01em;line-height:1.25}
.gate-name-en{font-family:var(--serif);font-size:clamp(10px,1.05vw,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mut);margin-top:9px}
.gq-zh{font-family:var(--serif);font-size:clamp(15px,1.5vw,19px);letter-spacing:.01em;color:var(--green-deep);font-weight:500;margin-top:22px}
.gq-en{font-size:12px;color:var(--ink-mut);margin-top:5px;letter-spacing:.02em}
.gpills{display:flex;gap:12px;justify-content:center;margin-top:22px}
.gpills button{font-size:14px;border:1px solid var(--line-p);background:none;color:var(--ink);border-radius:999px;padding:11px 32px;transition:all .25s}
.gpills button:hover{background:var(--green-deep);border-color:var(--green-deep);color:var(--paper)}
#gate.gate-fly{background-color:transparent}
#gate.gate-fly .gate-name,#gate.gate-fly .gate-name-en,#gate.gate-fly .gq-zh,#gate.gate-fly .gq-en,#gate.gate-fly .gpills{opacity:0;transform:translateY(10px);transition:opacity .32s ease,transform .32s ease;pointer-events:none}
@media(max-width:900px){nav{display:none}.hd{height:auto;padding:9px 18px}.hd .nm span{display:none}.wrap{padding:0 22px 0 52px}:root{--gut:28px}header{top:0;width:100%}}

/* ============ chapter hud ============ */
#hud{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:40;display:flex;align-items:center;gap:10px;color:rgba(243,237,226,.55);font-size:11px;letter-spacing:.08em;pointer-events:none;transition:color .4s}
#hud .hud-lines{display:flex;flex-direction:column;gap:3px}
#hud .hud-lines i{display:block;height:1px;background:currentColor;opacity:.55}
#hud .hud-lines i:nth-child(1){width:26px}
#hud .hud-lines i:nth-child(2){width:17px}
#hud .hud-lines i:nth-child(3){width:9px}
#hud .hud-no{font-family:var(--serif);font-size:13.5px;color:var(--pink)}
#hud .hud-sl{opacity:.5}
#hud.on-paper{color:rgba(34,29,21,.5)}
#hud.on-paper .hud-no{color:var(--ink)}
@media(max-width:1299px){#hud{display:none}}
/* ============ carousel controls ============ */
.grp .gh .gp{font-family:var(--serif);font-size:12px;color:var(--ink-mut);display:inline-flex;gap:6px;align-items:baseline;margin-left:16px}
.grp .gh .gp b{color:var(--ink);font-weight:600;border-bottom:1px solid var(--brown-deep);padding-bottom:2px}
.grp .gh .gp s{text-decoration:none}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-p);background:none;color:var(--ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:all .25s;margin-left:8px;flex-shrink:0}
.cbtn:hover{background:var(--green-deep);border-color:var(--green-deep);color:var(--paper)}
.cbtn[disabled]{opacity:.32;pointer-events:none}
.grp.nocar .gp,.grp.nocar .cbtn{display:none}
/* ============ editorial display type ============ */
h1,h2,h3,.serif{letter-spacing:-.015em}
h2{font-weight:500}
.dir h3,.grp .gh h3,.sup h3{font-weight:500}

/* ============ hero: misty sky depth stack ============ */
#home{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:118px 0 0;
  background:linear-gradient(to bottom,#EFF3F0 0%,#E9EFEA 38%,#E0E8E1 60%,#C2D0C4 80%,#69796A 91%,var(--stage) 100%)}
#home::before{content:"";position:absolute;top:0;left:0;right:0;height:132px;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,rgba(239,243,240,.94),rgba(239,243,240,.62) 52%,rgba(239,243,240,0))}
#skyFx{position:absolute;inset:-4%;z-index:1;pointer-events:none;
  background:
    radial-gradient(46% 34% at 68% 38%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),
    radial-gradient(62% 15% at 52% 64%,rgba(255,255,255,.55),rgba(255,255,255,0) 72%),
    radial-gradient(74% 17% at 28% 78%,rgba(228,238,231,.6),rgba(228,238,231,0) 74%);
  animation:fogdrift 26s ease-in-out infinite alternate}
@keyframes fogdrift{from{transform:translate3d(-1.4%,0,0) scale(1.02)}to{transform:translate3d(1.4%,-1.2%,0) scale(1.05)}}
#globeCv{position:absolute;left:0;top:6%;width:50%;height:86%;--gA:.8;pointer-events:none;z-index:1}
#birdCv{position:absolute;inset:0;pointer-events:none;z-index:1}
.islet{position:absolute;z-index:1;pointer-events:none;filter:blur(2px) saturate(.82);
  -webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 42%,transparent 78%);
  mask-image:radial-gradient(70% 70% at 50% 45%,#000 42%,transparent 78%)}
#islet1{left:58%;top:20%;width:150px;opacity:.42}
#islet2{left:82%;top:64%;width:92px;opacity:.26}
.fogband{position:absolute;left:-20%;width:140%;height:15vh;z-index:1;pointer-events:none;filter:blur(10px);
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.5),transparent);
  animation:banddrift 34s ease-in-out infinite alternate}
@keyframes banddrift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
#fb1{top:30%}
#fb2{top:56%;animation-duration:46s;animation-direction:reverse;opacity:.7}
#rays{position:absolute;inset:-12%;z-index:1;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 8%,rgba(255,255,255,.55) 10% 12%,rgba(255,255,255,0) 15% 27%);
  -webkit-mask-image:radial-gradient(80% 70% at 80% 6%,#000,transparent 72%);
  mask-image:radial-gradient(80% 70% at 80% 6%,#000,transparent 72%);
  animation:raysway 18s ease-in-out infinite alternate}
@keyframes raysway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
#partCv{position:absolute;inset:0;pointer-events:none;z-index:3}
#treeWrap{position:absolute;left:auto;right:1.5vw;top:0;bottom:0;margin:auto 0;width:min(46vw,69vh);aspect-ratio:850/1056;z-index:2;pointer-events:none;will-change:transform}
#treeWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  filter:saturate(1.03)}
#isleClip{position:absolute;inset:0;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 3.5%),linear-gradient(to bottom,#000 93%,transparent 99.5%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 3.5%),linear-gradient(to bottom,#000 93%,transparent 99.5%);
  mask-composite:intersect}
#islandCanopy{transform-origin:50% 26%;will-change:transform;
  -webkit-mask-image:linear-gradient(to bottom,#000 0 20%,transparent 33%);
  mask-image:linear-gradient(to bottom,#000 0 20%,transparent 33%)}
#islandMid{transform-origin:50% 44%;will-change:transform;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0 21%,#000 33% 40%,transparent 52%);
  mask-image:linear-gradient(to bottom,transparent 0 21%,#000 33% 40%,transparent 52%)}
#islandBase{
  -webkit-mask-image:linear-gradient(to bottom,transparent 0 40%,#000 52% 100%);
  mask-image:linear-gradient(to bottom,transparent 0 40%,#000 52% 100%)}
#rootCv{position:absolute;inset:0;z-index:3;pointer-events:none;will-change:transform}
#isleMist{position:absolute;right:0;bottom:-8vh;width:50vw;height:64vh;z-index:3;pointer-events:none;filter:blur(6px);
  background:radial-gradient(60% 55% at 62% 72%,rgba(233,239,234,.85),rgba(233,239,234,0) 70%),
             radial-gradient(42% 30% at 84% 40%,rgba(255,255,255,.5),transparent 70%);
  animation:fogdrift 22s ease-in-out infinite alternate}
#homeFade{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,rgba(20,28,18,0) 64%,rgba(20,28,18,.22) 80%,rgba(20,28,18,.78) 93%,var(--stage) 100%)}
#fgBranch{display:none;position:absolute;left:-9%;top:-14%;width:54vw;min-width:520px;z-index:5;pointer-events:none;
  mix-blend-mode:multiply;filter:blur(5px) saturate(.92) brightness(1.03);opacity:.95;will-change:transform;
  -webkit-mask-image:radial-gradient(120% 120% at 0% 0%,#000 34%,rgba(0,0,0,.55) 56%,transparent 74%),linear-gradient(to bottom,#000 82%,transparent 99%);
  -webkit-mask-composite:source-in;
  mask-image:radial-gradient(120% 120% at 0% 0%,#000 34%,rgba(0,0,0,.55) 56%,transparent 74%),linear-gradient(to bottom,#000 82%,transparent 99%);
  mask-composite:intersect}
#fgRootCv{display:none;position:absolute;left:0;top:0;width:46vw;height:52vh;z-index:5;pointer-events:none}
.hero-grid{display:block;width:100%;max-width:1240px;margin:0 auto;padding:0 48px;position:relative;z-index:4}
.hero-txt{position:relative;width:100%;max-width:640px;margin:0;padding:0;color:var(--ink);text-align:left}
.pocket{position:relative;margin:0;padding:0}
.hero-txt h1{font-size:clamp(34px,4.8vw,58px);line-height:1.16;margin:14px 0 22px;color:var(--ink);text-wrap:balance}
.hero-txt .lead{font-size:16.5px;line-height:1.9;color:rgba(34,29,21,.74);max-width:520px;margin:0}
.hero-txt .kicker{display:flex;align-items:center;justify-content:flex-start;color:var(--green-deep)}
html[lang="zh-CN"] .hero-txt .kicker{font-size:clamp(14px,1.3vw,20px);letter-spacing:.2em;font-weight:600}
html[lang="en"] .hero-txt .kicker{font-size:clamp(10px,.8vw,12.5px);letter-spacing:.1em;font-weight:600;white-space:nowrap}
.stats{display:flex;gap:46px;margin-top:42px;justify-content:flex-start}
.stats .n{font-family:var(--serif);font-size:32px;color:var(--green-deep);font-weight:600}
.stats .l{font-size:12.5px;color:var(--ink-mut);letter-spacing:.04em;margin-top:4px}
.hero-txt .stats .l{color:#4E4A40}
.hint{display:inline-flex;align-items:center;gap:9px;margin-top:40px;font-size:12.5px;letter-spacing:.02em;color:#4E4A40;border:1px dashed rgba(34,29,21,.32);border-radius:999px;padding:8px 16px;background:rgba(251,247,239,.42);transition:all .2s}
.hint:hover{color:var(--ink);border-color:rgba(34,29,21,.55);background:rgba(251,247,239,.7)}
.scroll-hint{position:absolute;left:34px;bottom:26px;z-index:6;font-size:11px;letter-spacing:.1em;color:var(--pink-mut);display:flex;align-items:center;gap:10px}
.scroll-hint i{display:block;width:1px;height:36px;background:linear-gradient(var(--green),transparent);animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* line-mask title reveal */
.lm{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.lm>i{display:block;font-style:normal;transform:translateY(112%);transition:transform .95s cubic-bezier(.2,.75,.15,1) var(--d,0s)}
#heroTitle.on .lm>i,.rv.in .lm>i{transform:none}
/* chapter transition veil */
#veil{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .3s ease}
/* section header parallax wrapper */
.shd{will-change:transform}
@media(max-width:900px){
  #home{flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:auto;padding-top:78px}
  .wrap.hero-grid{order:1;width:100%}
  #treeWrap{order:2;position:relative;inset:auto;right:auto;top:auto;transform:none!important;width:86%;max-width:none;margin:-6px auto 10px;aspect-ratio:850/1056}
  #fgBranch,#fgRootCv,.islet,#birdCv,#rays{display:none}
  #skyFx,#isleMist,.fogband{animation:none}
  #globeCv{--gA:.26;left:-6%;top:2%;width:110%;height:56%}
  .hero-txt{padding:30px 0 8px;max-width:none;margin:0 auto;text-align:center}
  .hero-txt .kicker{justify-content:center}
  html[lang="en"] .hero-txt .kicker{white-space:normal;letter-spacing:.14em}
  .hero-txt .lead{margin:0 auto}

.dirs{position:relative}

/* 03 achievements: trunk rail with growth-ring nodes */
#pubList{position:relative;padding-left:34px}

function bindDrag(tr){
  let down=false,sx=0,sl=0;
  tr.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sl=tr.scrollLeft;tr.style.scrollSnapType="";tr.classList.add("drag");tr.setPointerCapture(e.pointerId);});
  tr.addEventListener("pointermove",e=>{if(down)tr.scrollLeft=sl-(e.clientX-sx);});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>tr.addEventListener(ev,()=>{down=false;tr.classList.remove("drag");}));
  const bar=tr.closest(".car").querySelector(".bar i");
  const barWrap=bar.parentElement;
  const grp=tr.closest(".grp");
  const gk=tr.dataset.g;
  const gpCur=grp.querySelector(".gp b");
  const gpTot=grp.querySelector(".gp s");
  const prevBtn=grp.querySelector('.cbtn[data-cnav="'+gk+':-1"]');
  const nextBtn=grp.querySelector('.cbtn[data-cnav="'+gk+':1"]');
  const pad=n=>String(n).padStart(2,"0");
  const upd=()=>{const max=tr.scrollWidth-tr.clientWidth;
    if(max<1){barWrap.style.opacity="0";}else{barWrap.style.opacity="1";bar.style.width=(12+88*(tr.scrollLeft/max))+"%";}};
  const geom=()=>{
    const max=tr.scrollWidth-tr.clientWidth;
    const pages=max<1?1:Math.max(2,Math.ceil(tr.scrollWidth/tr.clientWidth));
    const cur=pages<2?1:Math.max(1,Math.min(pages,1+Math.round(tr.scrollLeft/max*(pages-1))));
    return {max,pages,cur};
  };
  const paint=()=>{
    const {max,pages,cur}=geom();
    if(max<1){grp.classList.add("nocar");}else{grp.classList.remove("nocar");}
    if(gpCur)gpCur.textContent=pad(cur);
    if(gpTot)gpTot.textContent=pad(pages);
    if(prevBtn)prevBtn.toggleAttribute("disabled",cur<=1);
    if(nextBtn)nextBtn.toggleAttribute("disabled",cur>=pages);
    upd();
  };
  const goPage=p=>{
    const {max,pages}=geom();
    if(pages<2||max<1)return;
    const q=Math.max(1,Math.min(pages,p));
    tr.style.scrollSnapType="none";
    tr.scrollTo({left:Math.round((q-1)/(pages-1)*max),behavior:"auto"});
    paint();
  };
  if(prevBtn)prevBtn.addEventListener("click",()=>goPage(geom().cur-1));
  if(nextBtn)nextBtn.addEventListener("click",()=>goPage(geom().cur+1));
  tr.addEventListener("scroll",paint,{passive:true});addEventListener("resize",paint);paint();
}

function buildSpine(){
  const svg=document.getElementById("spineSvg");
  const page=document.getElementById("page");
  const H=page.scrollHeight,W=page.clientWidth;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.style.height=H+"px";
  const gut=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--gut"))||72;
  const tree=document.getElementById("treeWrap").getBoundingClientRect();
  const pr=page.getBoundingClientRect();
  const homeB=document.getElementById("about").getBoundingClientRect().top-pr.top;
  const tx=tree.left-pr.left+tree.width*0.5,
        ty=Math.min(tree.top-pr.top+tree.height*0.80, homeB-30);
  let d=`M ${tx} ${ty} C ${tx-60} ${ty+90}, ${gut+150} ${homeB-40}, ${gut} ${homeB+70}`;
  const footTop=document.querySelector("footer").getBoundingClientRect().top-pr.top;
  d+=` L ${gut} ${footTop-30}`;
  let branches="",nodes="",dots="";
  [["about"],["members"],["pubs"],["news"]].forEach(([id])=>{
    const sec=document.getElementById(id);const r=sec.getBoundingClientRect();
    const y=r.top-pr.top+118;
    branches+=`<path class="branch" data-y="${y}" d="M ${gut} ${y} H ${Math.min(W-40,gut+(W>900? 30:20))}"/>`;
    nodes+=`<circle class="node" data-y="${y}" cx="${gut}" cy="${y}" r="4.5"/>`;});
  document.querySelectorAll(".ncard").forEach(c=>{
    const r=c.getBoundingClientRect();const y=r.top-pr.top+30;
    dots+=`<circle class="ndot" data-y="${y}" cx="${gut}" cy="${y}" r="3.4"/>`;});
  svg.innerHTML=`<path class="root" id="rootP" d="M ${tx} ${ty} C ${tx-60} ${ty+90}, ${gut+150} ${homeB-40}, ${gut} ${homeB+70}"/>
    <path class="main" id="mainP" d="M ${gut} ${homeB+70} L ${gut} ${footTop-30}"/>${branches}${nodes}${dots}`;
  const mp=document.getElementById("mainP"),rp=document.getElementById("rootP");
  [mp,rp].forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.dataset.len=L;});
  spineMeta={mp,rp, startY:homeB+70, endY:footTop-30};
  onScroll();
}
let spineMeta=null;
let hudIdx=-1;
function onScroll(){
  const sy=window.scrollY,vh=innerHeight;
  const hdEl=document.querySelector("header");
  hdEl.classList.toggle("scrolled",sy>32);
  /* full-width bar tints with the chapter under it: paper on light, ink on dark */
  let topSec=null;
  for(const id of ["home","about","members","pubs","news"]){
    const s=document.getElementById(id);if(!s)continue;
    const r=s.getBoundingClientRect();
    if(r.top<=64&&r.bottom>64){topSec=s;break;}
  }
  hdEl.classList.toggle("on-paper",!!topSec&&(topSec.classList.contains("on-paper")||(topSec.id==="home"&&sy<topSec.offsetHeight*0.55)));
  if(spineMeta){
    const {mp,rp,startY,endY}=spineMeta;
    const p=Math.max(0,Math.min(1,(sy+vh*0.72-startY)/(endY-startY)));
    mp.style.strokeDashoffset=mp.dataset.len*(1-p);
    const L=+rp.dataset.len;rp.style.strokeDashoffset=sy>40?0:L;
    rp.style.transition="stroke-dashoffset 1.2s ease";
    document.querySelectorAll("#spineSvg [data-y]").forEach(el=>{
      el.classList.toggle("on",+el.dataset.y < sy+vh*0.86);});
  }
  const SECS=["home","about","members","pubs","news"];
  let ci=0;
  document.querySelectorAll("nav a[data-sec]").forEach(a=>{
    const sec=document.getElementById(a.dataset.sec);if(!sec)return;
    const r=sec.getBoundingClientRect();
    const act=r.top<=vh*0.4&&r.bottom>vh*0.4;
    a.classList.toggle("on",act);
    if(act)ci=SECS.indexOf(a.dataset.sec);});
  if(ci<0)ci=0;
  if(ci!==hudIdx){
    hudIdx=ci;
    const hud=document.getElementById("hud");
    if(hud){
      document.getElementById("hudNo").textContent=String(ci).padStart(2,"0");
      document.getElementById("hudName").textContent=t().nav[ci]||"";
      const sec=document.getElementById(SECS[ci]);
      hud.classList.toggle("on-paper",!!(sec&&(sec.classList.contains("on-paper")||sec.id==="home")));
    }
  }
}

/* ---------- motion: particles + globe + canopy breathing + WIND ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts=[],leaves=[],birds=[],mouse={x:-9999,y:-9999},px=0,py=0,syT=0,sy=0;
let wind=0,windV=0,lx=0,ly=0,whist=[];
function initCanvas(){

  const bc=document.getElementById("birdCv"),rc=document.getElementById("rootCv"),fc=document.getElementById("fgRootCv");
  const hero=document.getElementById("home");
  let lastRot=1e9,globeDirty=true,gA=.8;
  function size(){const r=hero.getBoundingClientRect();
    pc.width=r.width*devicePixelRatio;pc.height=r.height*devicePixelRatio;

    const n=Math.min(70,Math.floor(r.width/18));parts=[];
    for(let i=0;i<n;i++)parts.push({x:Math.random()*r.width,y:Math.random()*r.height,
      vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.6+.8});
    leaves=[];const nl=Math.min(16,Math.floor(r.width/90));
    for(let i=0;i<nl;i++)leaves.push({x:Math.random()*r.width,y:Math.random()*r.height,
      vy:.25+Math.random()*.4,rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,
      sz:2.5+Math.random()*3.5,ph:Math.random()*6.28,warm:Math.random()<.4});
    birds=[];const nb=9;
    for(let i=0;i<nb;i++)birds.push({x:Math.random()*r.width,y0:r.height*(.10+Math.random()*.16),
      sp:.06+Math.random()*.09,ph:Math.random()*6.28,sz:1.6+Math.random()*1.8,wob:Math.random()*6.28});
  }
  size();addEventListener("resize",()=>{size();buildSpine();});
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();
    mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
    px=((e.clientX-r.left)/r.width-.5)*2;py=((e.clientY-r.top)/r.height-.5)*2;
  });
  hero.addEventListener("pointerleave",()=>{mouse.x=-9999;mouse.y=-9999;});
  const cx=pc.getContext("2d"),gx=gc.getContext("2d"),bx=bc.getContext("2d"),
        rx=rc.getContext("2d"),fx=fc.getContext("2d");
  let rot=-0.18,tt=0;
  function drawParts(){
    const w=pc.width/devicePixelRatio,h=pc.height/devicePixelRatio;
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    cx.clearRect(0,0,w,h);
    cx.globalAlpha=.55; /* former CSS opacity, baked into pixels */
    for(const p of parts){
      const dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy);
      if(dist<150&&dist>0.01){const f=(150-dist)/150*0.9;p.x+=dx/dist*f;p.y+=dy/dist*f;}
      p.x+=p.vx+wind*0.25;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
      p.x=(p.x+w)%w;
    }
    cx.lineWidth=1;
    for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){
      const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<118){cx.strokeStyle=`rgba(127,160,90,${(1-d/118)*.22})`;
        cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}
    }
    for(const p of parts){cx.fillStyle="rgba(200,160,120,.55)";
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();}
    /* falling leaves / spores, pushed by wind */
    for(const L of leaves){
      L.y+=L.vy;L.rot+=L.vr;L.x+=Math.sin(tt/900+L.ph)*.35+wind*1.1;
      if(L.y>h+8){L.y=-8;L.x=Math.random()*w;}
      if(L.x>w+10)L.x=-10;if(L.x<-10)L.x=w+10;
      cx.save();cx.translate(L.x,L.y);cx.rotate(L.rot+wind*.4);
      cx.fillStyle=L.warm?"rgba(168,124,84,.4)":"rgba(127,160,90,.38)";
      cx.beginPath();cx.ellipse(0,0,L.sz,L.sz*.45,0,0,7);cx.fill();cx.restore();
    }
    cx.globalAlpha=1;
  }
  function drawBirds(){
    const w=bc.width/devicePixelRatio,h=bc.height/devicePixelRatio;
    bx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    bx.clearRect(0,0,w,h);
    bx.globalAlpha=.42; /* former CSS opacity, baked into pixels */
    bx.lineCap="round";bx.filter="blur(1.2px)";
    for(const b of birds){
      b.x+=b.sp+wind*.12;
      if(b.x>w+16){b.x=-16;b.y0=h*(.10+Math.random()*.16);}
      const y=b.y0+Math.sin(tt/2600+b.wob)*6+Math.sin(tt/900+b.ph)*1.2;
      const up=Math.sin(tt/210+b.ph);
      const flap=up>0?up*0.9:up*0.35+Math.sin(tt/105+b.ph*2)*0.12;
      bx.strokeStyle=`rgba(58,68,58,${(0.30-b.sz*0.04).toFixed(3)})`;
      bx.lineWidth=Math.max(0.7,b.sz*0.32);
      bx.beginPath();
      bx.moveTo(b.x-b.sz,y);
      bx.quadraticCurveTo(b.x-b.sz*.5,y-b.sz*flap,b.x,y-b.sz*0.28);
      bx.quadraticCurveTo(b.x+b.sz*.5,y-b.sz*flap,b.x+b.sz,y);
      bx.stroke();
    }
    bx.filter="none";
    bx.globalAlpha=1;
  }
  /* tapered organic strand: 4 pts, width & alpha fall off toward the tip */
  function strand(ctx,pts,w0,col){
    for(let s=0;s<pts.length-1;s++){
      const t=s/(pts.length-1);
      ctx.strokeStyle=col.replace("A",(0.55-0.3*t).toFixed(2));
      ctx.lineWidth=w0*(1-0.75*t);
      ctx.beginPath();ctx.moveTo(pts[s][0],pts[s][1]);ctx.lineTo(pts[s+1][0],pts[s+1][1]);ctx.stroke();
    }
  }
  function drawRoots(){
    const w=rc.width/devicePixelRatio,h=rc.height/devicePixelRatio;
    rx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    rx.clearRect(0,0,w,h);
    rx.lineCap="round";
    const N=8;
    for(let i=0;i<N;i++){
      const f=i/(N-1);
      const ax=w*(0.40+0.24*f);            /* over the trunk / real root curtain */
      const ay=h*(0.44+Math.sin(f*7)*0.02);
      const len=h*(0.08+0.10*Math.abs(Math.sin(f*11+2)));
      const bow=(i%2?1:-1)*(4+(i%3)*3);
      const lag=whist[Math.max(0,whist.length-1-i*2)]||0;
      const sway=lag*(16+f*20)+Math.sin(tt/700+i)*1.6;
      strand(rx,[[ax,ay],
        [ax+bow*.5+sway*.3,ay+len*.4],
        [ax+bow+sway*.7,ay+len*.75],
        [ax+bow*1.2+sway,ay+len]],2.2,"rgba(50,64,40,A)");
    }
  }
  function drawFgRoots(){
    const w=fc.width/devicePixelRatio,h=fc.height/devicePixelRatio;
    fx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    fx.clearRect(0,0,w,h);
    fx.filter="blur(3px)";fx.globalAlpha=.65; /* former CSS filter+opacity, baked */
    fx.lineCap="round";
    const N=5;
    for(let i=0;i<N;i++){
      const f=i/(N-1);
      const ax=w*(0.45+0.45*f);
      const ay=h*(0.40+Math.sin(f*5)*0.06);
      const len=h*(0.30+0.25*Math.abs(Math.sin(f*9+1)));
      const bow=(i%2?1:-1)*(8+(i%3)*6);
      const lag=whist[Math.max(0,whist.length-1-i*3)]||0;
      const sway=lag*(18+f*22)+Math.sin(tt/800+i*2)*2.6;
      strand(fx,[[ax,ay],
        [ax+bow*.5+sway*.25,ay+len*.35],
        [ax+bow+sway*.6,ay+len*.7],
        [ax+bow*1.3+sway,ay+len]],5,"rgba(46,58,38,A)");
    }
    fx.filter="none";fx.globalAlpha=1;
  }
  let LAND=null;
  function getLand(){if(LAND)return LAND;const b=atob(LAND_B64);LAND=new Uint8Array(b.length);for(let i=0;i<b.length;i++)LAND[i]=b.charCodeAt(i);return LAND;}
  /* terra-globe-style shading: precomputed light(5) x depth(4) palette buckets.
     Lit face = deep ink-green & opaque; shadow limb = pale sage & faint. */
  const GT=5,GF=4,GPAL=[];
  (function(){
    const SH=[134,152,116],LT=[34,50,28];
    for(let ti=0;ti<GT;ti++){
      const k=ti/(GT-1);
      const r=Math.round(SH[0]+(LT[0]-SH[0])*k),g=Math.round(SH[1]+(LT[1]-SH[1])*k),b=Math.round(SH[2]+(LT[2]-SH[2])*k);
      for(let fi=0;fi<GF;fi++)GPAL.push(`rgba(${r},${g},${b},${(0.30+0.60*(fi/(GF-1))).toFixed(2)})`);
    }
  })();
  /* Globe draws straight onto the visible canvas, throttled: on skipped frames the
     canvas is left untouched (nothing else paints it) so the previous dots persist.
     The 1° grid is too heavy to repaint every single frame. */
  function drawGlobe(){
    if(!RM)rot+=0.0016;
    if(!globeDirty&&lastRot!==1e9&&Math.abs(rot-lastRot)<0.0045)return;
    globeDirty=false;lastRot=rot;
    const w=gc.width/devicePixelRatio,h=gc.height/devicePixelRatio;
    gx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    gx.clearRect(0,0,w,h);
    const R=Math.min(w,h)*0.36,cx0=w/2,cy0=h/2;
    const L=getLand();
    const tilt=0.20,ct=Math.cos(tilt),st=Math.sin(tilt),cr=Math.cos(rot),sr=Math.sin(rot);
    /* atmospheric halo: soft theme-green ring breathing outside the limb */
    const halo=gx.createRadialGradient(cx0,cy0,R*0.92,cx0,cy0,R*1.16);
    halo.addColorStop(0,"rgba(127,160,90,0)");halo.addColorStop(.55,"rgba(127,160,90,.085)");
    halo.addColorStop(.8,"rgba(127,160,90,.03)");halo.addColorStop(1,"rgba(127,160,90,0)");
    gx.globalAlpha=gA;gx.fillStyle=halo;gx.beginPath();gx.arc(cx0,cy0,R*1.18,0,6.2832);gx.fill();
    /* limb */
    gx.strokeStyle="rgba(127,160,90,.20)";gx.lineWidth=1;
    gx.beginPath();gx.arc(cx0,cy0,R,0,6.2832);gx.stroke();
    /* fixed key light from upper-left-front, screen space (terra-globe look) */
    const LX=-0.48,LY=0.52,LZ=0.70;
    const base=Math.max(1.6,Math.min(3.4,R/110));
    /* ocean: sparse 3°-sampled whisper-faint dots give the sphere its volume
       without competing with the hero type */
    gx.fillStyle="rgba(56,78,50,.075)";
    const so=Math.max(1.1,base*0.5);
    for(let r=1;r<180;r+=3){
      const la=(90-1*(r+0.5))*Math.PI/180,y=Math.sin(la),ca=Math.cos(la);
      for(let c=0;c<360;c+=3){
        const idx=r*360+c;
        if((L[idx>>3]>>(7-(idx&7)))&1)continue;
        const lo=(-180+1*(c+0.5))*Math.PI/180;
        const x=ca*Math.cos(lo),z=ca*Math.sin(lo);
        const x2=x*cr-z*sr,zr=x*sr+z*cr;
        const y2=y*ct-zr*st,z2=y*st+zr*ct;
        if(z2<=0.10)continue;
        gx.fillRect(cx0+x2*R-so/2,cy0-y2*R-so/2,so,so);
      }
    }
    /* continents: 1° dot grid, light(5) x depth(4) palette buckets */
    for(let r=0;r<180;r++){
      const la=(90-1*(r+0.5))*Math.PI/180,y=Math.sin(la),ca=Math.cos(la);
      for(let c=0;c<360;c++){
        const idx=r*360+c;
        if(!((L[idx>>3]>>(7-(idx&7)))&1))continue;
        const lo=(-180+1*(c+0.5))*Math.PI/180;
        const x=ca*Math.cos(lo),z=ca*Math.sin(lo);
        const x2=x*cr-z*sr,zr=x*sr+z*cr;
        const y2=y*ct-zr*st,z2=y*st+zr*ct;
        if(z2<=0.03)continue;
        const sxp=cx0+x2*R,syp=cy0-y2*R;
        let lt=(x2*LX+y2*LY+z2*LZ+1)*0.5;   /* 0 shadow limb … 1 lit face */
        lt=lt*lt*(3-2*lt);                    /* smoothstep the terminator */
        lt=0.25+0.75*lt;                      /* keep the dark side readable on paper */
        const f=(z2-0.03)/0.97;
        const b=((lt*(GT-1)+0.5)|0)*GF+((f*(GF-1)+0.5)|0);
        const s=base*(0.78+0.5*z2);
        gx.fillStyle=GPAL[b];
        gx.fillRect(sxp-s/2,syp-s/2,s,s);
      }
    }
    gx.globalAlpha=1;
  }
  function loop(ts){
    if(window.__freeze)return;
    tt=ts;syT=window.scrollY;sy+=(syT-sy)*.09;
    /* wind: constant micro-breeze only, soft spring so the crown breathes not jerks */
    const breeze=Math.sin(ts/2600)*0.30+Math.sin(ts/1650+1.7)*0.14+Math.sin(ts/9300+0.6)*0.10;
    windV+=(breeze-wind)*0.045;windV*=0.92;wind+=windV;
    /* pointer parallax: heavy lerp so depth layers drift toward the cursor */
    lx+=(px-lx)*0.022;ly+=(py-ly)*0.022;
    whist.push(wind);if(whist.length>40)whist.shift();
    drawParts();drawGlobe();drawBirds();drawRoots();drawFgRoots();
    const wide=innerWidth>=900;
    if(wide){
      const br=Math.sin(ts/1500)*0.006;
      const tw=document.getElementById("treeWrap");
      if(tw)tw.style.transform=
        `translate3d(${(lx*-7).toFixed(1)}px,${(sy*0.06+ly*-5).toFixed(1)}px,0) scale(${(1+br).toFixed(4)})`;
      const wMid=whist[Math.max(0,whist.length-10)]||0;
      const cp=document.getElementById("islandCanopy");
      if(cp)cp.style.transform=`rotate(${(wind*0.85).toFixed(2)}deg) skewX(${(wind*0.45).toFixed(2)}deg) translateX(${(wind*3).toFixed(1)}px)`;
      const cm=document.getElementById("islandMid");
      if(cm)cm.style.transform=`rotate(${(wMid*0.40).toFixed(2)}deg) skewX(${(wMid*0.22).toFixed(2)}deg) translateX(${(wMid*1.6).toFixed(1)}px)`;
      const fg=document.getElementById("fgBranch");
      if(fg)fg.style.transform=`translate3d(${(lx*16+wind*-4).toFixed(1)}px,${(sy*0.16+ly*10).toFixed(1)}px,0) rotate(${(wind*-0.5).toFixed(2)}deg)`;
      const i1=document.getElementById("islet1");
      if(i1)i1.style.transform=`translate3d(${(lx*-22).toFixed(1)}px,${(ly*-10).toFixed(1)}px,0)`;
      const i2=document.getElementById("islet2");
      if(i2)i2.style.transform=`translate3d(${(lx*-34).toFixed(1)}px,${(ly*-16).toFixed(1)}px,0)`;
      const ab=document.getElementById("about");
      if(ab){const gy=(-ab.getBoundingClientRect().top*0.05).toFixed(1);
        ab.style.backgroundPosition=`0 ${gy}px, 0 ${gy}px, 0 0`;}
      document.querySelectorAll(".shd").forEach(el=>{
        const r=el.getBoundingClientRect();
        const p=(r.top+r.height/2-innerHeight/2)/innerHeight;
        el.style.transform=`translateY(${(p*-14).toFixed(1)}px)`;});
    }
    document.querySelector(".hero-txt").style.opacity=Math.max(0,1-sy/(innerHeight*0.9));
    requestAnimationFrame(loop);
  }
  if(RM){wind=0;whist=[0];
    const still=()=>{if(window.__freeze)return;drawParts();drawGlobe();drawBirds();drawRoots();drawFgRoots();requestAnimationFrame(still);};
    still();}
  else requestAnimationFrame(loop);
  addEventListener("scroll",()=>{if(RM)onScroll();else onScroll();},{passive:true});
}

/* ---------- reveal & count ---------- */
let io;
function countUp(root){
  root.querySelectorAll("[data-cnt]").forEach(cnt=>{
    const target=+cnt.dataset.cnt;let c=0;const step=Math.max(1,Math.round(target/28));
    const iv=setInterval(()=>{c+=step;if(c>=target){c=target;clearInterval(iv);}cnt.textContent=c;},34);});
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");
    countUp(e.target);
    io.unobserve(e.target);}}),{threshold:.14});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const na=e.target.closest("#nav a[data-sec]");
  if(na){const sec=document.getElementById(na.dataset.sec),v=document.getElementById("veil");
    if(sec&&v){v.style.background=sec.classList.contains("on-paper")?"rgba(243,237,226,.5)":"rgba(15,22,16,.5)";
      v.style.opacity="1";setTimeout(()=>{v.style.opacity="0";},320);}
  }
  const tab=e.target.closest("[data-tab]");if(tab){pubTab=+tab.dataset.tab;pubYear="all";renderTabs();renderPubs();observe();return;}
  const yc=e.target.closest("[data-year]");if(yc){pubYear=yc.dataset.year;renderTabs();renderPubs();observe();return;}
  const lg=e.target.closest(".lang button");if(lg){setLang(lg.dataset.lang);return;}
  const mc=e.target.closest(".mcard");if(mc){const [k,i]=mc.dataset.m.split(":");const m=MEM[k][+i];
    openModal(personModalData(Object.assign({grp:k},m),false),k==="ms"?"b":"g");return;}
  if(e.target.closest("#supCard")){openModal(personModalData(SUP,true),"g");return;}
  const more=e.target.closest(".ncard .more");if(more){const card=more.closest(".ncard");
    card.classList.toggle("open");more.textContent=card.classList.contains("open")?t().less+" ↑":t().moreN+" ↓";return;}
  const ext=e.target.closest(".ncard.ext");if(ext&&!more){window.open(NEWS[+ext.dataset.n].wx,"_blank");return;}
  const f=e.target.closest("#schips button");if(f){sFilter=f.dataset.f;openSearch();runSearch();return;}
  const si=e.target.closest(".sitem");if(si){const it=sResults[+si.dataset.i];closeSearch();it.act();return;}
});
document.getElementById("sOpen").addEventListener("click",openSearch);
document.getElementById("hintBtn").addEventListener("click",openSearch);
document.getElementById("mClose").addEventListener("click",closeModal);
document.getElementById("mov").addEventListener("click",e=>{if(e.target.id==="mov")closeModal();});
document.getElementById("sov").addEventListener("click",e=>{if(e.target.id==="sov")closeSearch();});
document.getElementById("sin").addEventListener("input",runSearch);
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();return;}
  if(e.key==="Escape"){closeLogoZoom();closeSearch();closeModal();return;}
  if(document.getElementById("sov").classList.contains("open")){
    if(e.key==="ArrowDown"){e.preventDefault();sAct=Math.min(sResults.length-1,sAct+1);drawSearch(document.getElementById("sin").value.trim().toLowerCase());}
    if(e.key==="ArrowUp"){e.preventDefault();sAct=Math.max(0,sAct-1);drawSearch(document.getElementById("sin").value.trim().toLowerCase());}
    if(e.key==="Enter"&&sResults[sAct]){closeSearch();sResults[sAct].act();}
  }});
/* logo zoom lightbox */
function closeLogoZoom(){document.getElementById("logoZoom").classList.remove("on");}
document.getElementById("logoBtn").addEventListener("click",()=>{document.getElementById("logoZoom").classList.add("on");});
document.getElementById("lzClose").addEventListener("click",closeLogoZoom);
document.getElementById("logoZoom").addEventListener("click",e=>{if(e.target.id==="logoZoom")closeLogoZoom();});
function setLang(l){LANG=l;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  hudIdx=-1;
  renderAll();}

/* ---------- boot ---------- */
document.getElementById("logoSm").src="data:image/webp;base64,"+LOGO_B64;
document.getElementById("logoFt").src="data:image/webp;base64,"+LOGO_B64;
document.getElementById("logoBig").src="data:image/webp;base64,"+LOGO_B64;
const ISLE_SRC="data:image/webp;base64,"+ISLAND_B64;
["islandBase","islandMid","islandCanopy","islet1","islet2"].forEach(id=>{document.getElementById(id).src=ISLE_SRC;});
document.getElementById("fgBranch").src="data:image/webp;base64,"+BRANCH_B64;
document.getElementById("islandBase").onload=()=>{buildSpine();};
renderAll();
(function(){
  const gate=document.getElementById("gate");
  document.getElementById("logoGate").src="data:image/webp;base64,"+LOGO_B64;
  const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let flying=false;
  function fly(l){
    if(flying)return; flying=true;
    setLang(l);
    try{localStorage.setItem("ctr_lang",l);}catch(e){}
    const seal=gate.querySelector(".gate-seal");
    const btn=document.getElementById("logoBtn");
    const s=seal.getBoundingClientRect(), t=btn.getBoundingClientRect();
    const dx=(t.left+t.width/2)-(s.left+s.width/2);
    const dy=(t.top+t.height/2)-(s.top+s.height/2);
    const sc=t.width/s.width;
    const done=()=>{gate.style.visibility="hidden";gate.style.pointerEvents="none";};
    if(RM){gate.classList.add("gate-fly");done();return;}
    seal.style.position="fixed";seal.style.margin="0";
    seal.style.left=s.left+"px";seal.style.top=s.top+"px";
    seal.style.width=s.width+"px";seal.style.height=s.height+"px";
    gate.appendChild(seal);
    gate.classList.add("gate-fly");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      seal.style.transform="translate("+dx+"px,"+dy+"px) scale("+sc+")";
    }));
    seal.addEventListener("transitionend",e=>{if(e.propertyName==="transform")done();},{once:true});
    setTimeout(done,1500);
  }
  gate.addEventListener("click",e=>{const b=e.target.closest("[data-glang]");if(b)fly(b.dataset.glang);});
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!flying)fly("zh");});
})();
initCanvas();
addEventListener("load",()=>{buildSpine();observe();});
</script>
