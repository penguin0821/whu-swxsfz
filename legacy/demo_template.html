<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涉外刑事风险治理与合规中心 · Demo</title>
<style>
/* ============ design tokens ============ */
:root{
  --paper:#FAF8F3; --card:#FFFDF9; --ink:#26221B; --muted:#6E675C;
  --green:#5C7F3A; --green-deep:#3E5B26; --green-soft:#EDF2E4;
  --brown:#8A5A3B; --brown-soft:#F3EBE2; --line:#E5DECF;
  --serif:Georgia,"Songti SC","Noto Serif CJK SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(38,34,27,.05),0 8px 24px -12px rgba(38,34,27,.14);
  --shadow-lift:0 2px 4px rgba(38,34,27,.06),0 18px 40px -16px rgba(38,34,27,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
::selection{background:var(--green-soft);color:var(--green-deep)}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* ============ header ============ */
header{position:sticky;top:0;z-index:50;background:rgba(250,248,243,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:68px}
.hd img{width:40px;height:40px;border-radius:50%}
.hd .nm{line-height:1.25;margin-right:auto}
.hd .nm b{font-family:var(--serif);font-size:15.5px;font-weight:600;display:block}
.hd .nm span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
nav{display:flex;gap:4px}
nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;transition:color .2s,background .2s}
nav a:hover{color:var(--ink);background:var(--brown-soft)}
nav a.on{color:var(--green-deep);background:var(--green-soft)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:10px;background:var(--card)}
.lang button{font-family:var(--mono);font-size:12px;border:0;background:none;color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;transition:all .2s}
.lang button.on{background:var(--green-deep);color:#FDFCF8}
@media(max-width:860px){nav{display:none}.hd{height:auto;padding:10px 0}.hd .nm span{display:none}.hd .nm b{font-size:14.5px}}

/* ============ hero ============ */
#home{position:relative;overflow:hidden;min-height:92vh;display:flex;align-items:center}
#globeCv{position:absolute;top:-6%;right:-14%;width:76%;height:112%;z-index:0;opacity:.55;pointer-events:none}
#partCv{position:absolute;inset:0;z-index:1;pointer-events:none}
#treeWrap{position:absolute;right:-2%;bottom:-4%;width:min(47vw,620px);z-index:2;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 74%,rgba(0,0,0,.55) 88%,transparent 99%);mask-image:linear-gradient(to bottom,#000 74%,rgba(0,0,0,.55) 88%,transparent 99%)}
#treeWrap img{width:100%;display:block;filter:drop-shadow(0 30px 40px rgba(38,34,27,.18))}
.hero-txt{position:relative;z-index:3;max-width:600px;padding:80px 0}
.hero-txt h1{font-size:clamp(34px,4.6vw,56px);line-height:1.18;margin:6px 0 22px;text-wrap:balance}
.hero-txt .lead{font-size:17px;color:var(--muted);max-width:46ch}
.stats{display:flex;gap:44px;margin-top:44px}
.stats .n{font-family:var(--mono);font-size:30px;color:var(--green-deep);font-weight:500}
.stats .l{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.scroll-hint{position:absolute;left:32px;bottom:26px;z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:10px}
.scroll-hint i{display:block;width:1px;height:34px;background:linear-gradient(var(--green),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:860px){#treeWrap{width:78vw;right:-16%;opacity:.9}.hero-txt{padding:60px 0}}

/* ============ sections ============ */
section{padding:110px 0}
.sec-h{margin-bottom:52px}
.sec-h h2{font-size:clamp(26px,3vw,38px);line-height:1.3}
.sec-h .sub{color:var(--muted);margin-top:10px;max-width:56ch}

/* directions */
.dirs{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px}
.dir{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px 34px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;position:relative;overflow:hidden}
.dir:hover{transform:translateY(-6px);box-shadow:var(--shadow-lift)}
.dir svg{width:34px;height:34px;stroke:var(--green);fill:none;stroke-width:1.5;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.dir:hover svg{transform:rotate(-8deg) scale(1.12)}
.dir h3{font-size:20px;margin:18px 0 10px}
.dir p{font-size:14.5px;color:var(--muted)}
.dir .idx{position:absolute;right:22px;top:18px;font-family:var(--mono);font-size:12px;color:var(--line)}
.dir:first-child{background:linear-gradient(150deg,var(--green-soft),var(--card) 62%)}
@media(max-width:860px){.dirs{grid-template-columns:1fr}}

/* members */
.group{margin-bottom:56px}
.group-h{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.group-h h3{font-size:21px}
.group-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{height:1px;background:var(--line);position:relative;margin-bottom:22px}
.bar i{position:absolute;left:0;top:-1px;height:3px;width:12%;background:var(--green);border-radius:2px;transition:width .15s linear,transform .15s linear}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 4px 22px;cursor:grab;
  mask-image:linear-gradient(90deg,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-snap-type:none}
.mcard{flex:0 0 218px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s;position:relative}
.mcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift)}
.ava{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:23px;color:#FDFCF8;margin-bottom:14px}
.ava.g{background:linear-gradient(140deg,var(--green),var(--green-deep))}
.ava.b{background:linear-gradient(140deg,var(--brown),#6B4128)}
.mcard b{font-family:var(--serif);font-size:17px;display:block}
.mcard .role{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.mcard .note{font-size:12.5px;color:var(--muted);line-height:1.55}
.yr{position:absolute;right:16px;top:16px;font-family:var(--mono);font-size:10.5px;color:var(--brown);background:var(--brown-soft);padding:2px 8px;border-radius:999px}
.tag{display:inline-block;font-size:11px;color:var(--green-deep);background:var(--green-soft);border-radius:999px;padding:2px 9px;margin-top:10px}
/* supervisor feature */
.sup{display:grid;grid-template-columns:200px 1fr;gap:36px;background:linear-gradient(120deg,var(--brown-soft),var(--card) 55%);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:var(--shadow);margin-bottom:60px;align-items:center}
.sup .ava{width:132px;height:132px;font-size:52px;margin:0}
.sup h3{font-size:26px}
.sup .role{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--brown);text-transform:uppercase;margin:6px 0 14px}
.sup p{color:var(--muted);font-size:15px;max-width:62ch}
.sup .mail{display:inline-block;margin-top:14px;font-family:var(--mono);font-size:13px;color:var(--green-deep);text-decoration:none;border-bottom:1px solid var(--green-soft)}
.sup .tags{margin-top:6px}
@media(max-width:860px){.sup{grid-template-columns:1fr;text-align:left}.sup .ava{width:96px;height:96px;font-size:38px}}

/* publications */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font-size:14px;font-family:var(--sans);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 18px;cursor:pointer;transition:all .25s}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:30px}
.chips button{font-family:var(--mono);font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .2s}
.chips button.on{background:var(--green-soft);color:var(--green-deep)}
.pub{display:grid;grid-template-columns:52px 1fr auto;gap:20px;padding:24px 8px;border-top:1px solid var(--line);align-items:baseline;transition:background .25s}
.pub:hover{background:var(--card)}
.pub:last-child{border-bottom:1px solid var(--line)}
.pub .no{font-family:var(--mono);font-size:12px;color:var(--line)}
.pub b{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.5;display:block}
.pub .meta{font-size:13px;color:var(--muted);margin-top:5px}
.pub .venue{font-family:var(--mono);font-size:11.5px;color:var(--green-deep);background:var(--green-soft);border-radius:6px;padding:3px 9px;white-space:nowrap}
.pub .rchip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--brown);border:1px solid rgba(138,90,59,.35);border-radius:999px;padding:2px 10px;background:rgba(138,90,59,.06)}

/* news timeline */
.tl{position:relative;padding-left:34px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ncard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:26px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.ncard:hover{transform:translateX(4px);box-shadow:var(--shadow-lift)}
.ncard:before{content:"";position:absolute;left:-31px;top:32px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--green)}
.ncard.ext:before{border-color:var(--brown)}
.nhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ntag{font-size:11px;border-radius:999px;padding:3px 10px;background:var(--green-soft);color:var(--green-deep)}
.ntag.t-forum{background:#E8EEF5;color:#33567E}
.ntag.t-field{background:var(--brown-soft);color:var(--brown)}
.ntag.t-collab{background:#EFEAF4;color:#5D4A78}
.ntag.t-life{background:#F0EDE6;color:#6E675C}
.ntag.t-award{background:#F6E9DC;color:#96562A}
.ndate{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wxBadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:#07C160;border:1px solid rgba(7,193,96,.35);border-radius:999px;padding:2px 9px}
.ncard h3{font-size:19px;line-height:1.45}
.ncard .sum{color:var(--muted);font-size:14.5px;margin-top:8px}
.ncard .body{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--muted)}
.ncard.open .body{display:block;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ncard .more{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--green-deep);background:none;border:0;cursor:pointer;padding:0;letter-spacing:.06em}
.ncard .more:hover{text-decoration:underline}
.ncard.ext a.cover-link{position:absolute;inset:0}
.cnonly{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* footer */
footer{border-top:1px solid var(--line);padding:64px 0 44px;background:var(--card)}
.ft{display:grid;grid-template-columns:auto 1fr auto;gap:48px;align-items:start}
.ft img{width:76px;height:76px;border-radius:50%}
.ft b{font-family:var(--serif);font-size:16px;display:block;margin-bottom:8px}
.ft p{font-size:13.5px;color:var(--muted)}
.ft .mono{font-size:12.5px}
.disc{margin-top:44px;padding-top:20px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:860px){.ft{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

/* ================= interactions ================= */
function observeReveal(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));
}
function countUp(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return; io.unobserve(e.target);
    const end = +e.target.dataset.cnt, t0 = performance.now();
    const step = (now)=>{const k = Math.min(1,(now-t0)/900); e.target.textContent = Math.round(end*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  }),{threshold:.6});
  document.querySelectorAll("[data-cnt]").forEach(el=>io.observe(el));
}
function bindTracks(){
  document.querySelectorAll(".track").forEach(tr=>{
    const fill = tr.parentElement.querySelector(".bar i");
    const upd = ()=>{const max = tr.scrollWidth - tr.clientWidth;
      const k = max>0 ? tr.scrollLeft/max : 0;
      fill.style.width = Math.max(12, k*88+12) + "%";};
    tr.addEventListener("scroll", upd, {passive:true}); upd();
    let down=false,sx=0,sl=0;
    tr.addEventListener("pointerdown",e=>{down=true;sx=e.clientX;sl=tr.scrollLeft;tr.classList.add("drag");tr.setPointerCapture(e.pointerId);});
    tr.addEventListener("pointermove",e=>{if(down) tr.scrollLeft = sl-(e.clientX-sx);});
    ["pointerup","pointercancel"].forEach(ev=>tr.addEventListener(ev,()=>{down=false;tr.classList.remove("drag");}));
  });
}

const pCtx = pCv.getContext("2d"), gCtx = gCv.getContext("2d");
let W=0,H=0,GW=0,GH=0, mouse={x:-9999,y:-9999}, heroVisible=true;

function sizeCanvases(){
  const dpr = Math.min(2, devicePixelRatio||1);
  W = hero.clientWidth; H = hero.clientHeight;
  pCv.width = W*dpr; pCv.height = H*dpr; pCtx.setTransform(dpr,0,0,dpr,0,0);
  GW = gCv.clientWidth; GH = gCv.clientHeight;
  gCv.width = GW*dpr; gCv.height = GH*dpr; gCtx.setTransform(dpr,0,0,dpr,0,0);
}
/* particles with mouse repulsion */
let P=[];
function initParticles(){
  const n = Math.round(Math.min(78, W/16));
  P = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}));
}
function drawParticles(){
  pCtx.clearRect(0,0,W,H);
  const R=150;
  for(const p of P){
    const dx=p.x-mouse.x, dy=p.y-mouse.y, d=Math.hypot(dx,dy);
    if(d<R&&d>0.01){const f=(1-d/R)*1.6; p.vx+=dx/d*f*.6; p.vy+=dy/d*f*.6;}
    p.vx*=.965; p.vy*=.965;
    p.vx+= (Math.random()-.5)*.02; p.vy+=(Math.random()-.5)*.02;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20; if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
  }
  pCtx.lineWidth=1;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<118){pCtx.strokeStyle=`rgba(92,127,58,${(1-d/118)*.30})`;pCtx.beginPath();pCtx.moveTo(a.x,a.y);pCtx.lineTo(b.x,b.y);pCtx.stroke();}
  }
  for(const p of P){pCtx.fillStyle="rgba(138,90,59,.55)";pCtx.beginPath();pCtx.arc(p.x,p.y,1.7,0,7);pCtx.fill();}
}
/* dotted wireframe globe */
let SP=[];
(function(){for(let lat=-75;lat<=75;lat+=15)for(let lon=0;lon<360;lon+=12){
  const la=lat*Math.PI/180, lo=lon*Math.PI/180;
  SP.push([Math.cos(la)*Math.cos(lo), Math.sin(la), Math.cos(la)*Math.sin(lo)]);}})();
let rot=0;
function drawGlobe(){
  gCtx.clearRect(0,0,GW,GH);
  const cx=GW/2, cy=GH/2, R=Math.min(GW,GH)*.42;
  const tilt=.42 + (mouse.y-H/2)/H*.12, yaw=rot + (mouse.x-W/2)/W*.25;
  for(const p of SP){
    let x=p[0],y=p[1],z=p[2];
    let x1=x*Math.cos(yaw)+z*Math.sin(yaw), z1=-x*Math.sin(yaw)+z*Math.cos(yaw);
    let y2=y*Math.cos(tilt)-z1*Math.sin(tilt), z2=y*Math.sin(tilt)+z1*Math.cos(tilt);
    if(z2<=0) continue;
    const sx=cx+x1*R, sy=cy+y2*R, al=.10+z2*.42;
    gCtx.fillStyle=`rgba(92,127,58,${al})`;
    gCtx.beginPath();gCtx.arc(sx,sy,1.15+z2*1.1,0,7);gCtx.fill();
  }
  gCtx.strokeStyle="rgba(92,127,58,.14)";gCtx.lineWidth=1;
  gCtx.beginPath();gCtx.arc(cx,cy,R,0,7);gCtx.stroke();
}
/* parallax */
let sy=0, syT=0;
function loop(now){
  sy += (syT-sy)*.09;
  document.getElementById("globeCv").style.transform=`translateY(${sy*.10}px)`;
  pCv.style.transform=`translateY(${sy*.16}px)`;
  document.getElementById("treeWrap").style.transform=`translateY(${sy*.26}px)`;
  document.querySelector(".hero-txt").style.transform=`translateY(${sy*.30}px)`;
  document.querySelector(".hero-txt").style.opacity=Math.max(0,1-sy/(H*.9));
  rot = now*.00006;
  if(heroVisible){drawParticles();drawGlobe();}
  requestAnimationFrame(loop);
}

hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
hero.addEventListener("pointerleave",()=>{mouse.x=-9999;mouse.y=-9999;});
new IntersectionObserver(es=>{heroVisible=es[0].isIntersecting;},{threshold:0}).observe(hero);
addEventListener("resize",()=>{sizeCanvases();initParticles();});

sizeCanvases(); initParticles();
renderAll();
if(RM){drawParticles();drawGlobe();}else{requestAnimationFrame(loop);}
</script>
